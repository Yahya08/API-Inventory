services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    # ports:
    #   - "5432:5432"  # Diberi komentar agar tidak bentrok dengan PostgreSQL lokal Anda
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory
      JWT_SECRET: ${JWT_SECRET:-ganti-secret-ini-untuk-produksi-minimal-32-karakter}
      JWT_EXPIRES_IN: 1h
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
